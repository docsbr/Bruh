plugins { id 'com.android.application' }
android {
    namespace 'com.whatsapp.gb'
    compileSdk 33
    defaultConfig {
        applicationId "com.whatsapp.gb"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.github.nkzawa:socket.io-client:0.6.0'
}
